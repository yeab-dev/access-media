# Render Blueprint: Dashboard → New → Blueprint → pick this repository → Apply.
# Two services: the app (player, API, docs, studio, example site) and a private speech model for automatic captions.
# Both need a paid plan: the free plan has no disk, and too little memory for PDF printing and speech recognition.
services:
  - type: web
    name: access-media
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 GB memory: Chromium (tagged PDFs) and ffmpeg (video) need it
    region: frankfurt         # closest Render region to Ethiopia
    healthCheckPath: /api/v1/health
    disk:
      name: data              # lessons, captions, sign videos, keys, certificates
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: ADMIN_TOKEN      # the host's master key: Render makes a long random one; see it under Environment
        generateValue: true
      - key: TRUST_PROXY      # Render's load balancer is in front of us: correct https links and client addresses
        value: "1"
      - key: SIGNUP           # anyone may get a provider key from /get-key, within the limits below
        value: open
      - key: PROVIDER_MAX_LESSONS
        value: "10"
      - key: PROVIDER_MAX_UPLOAD_MB
        value: "200"
      - key: ASR_MODEL
        value: Systran/faster-whisper-small
      - key: ASR_URL          # the private speech model below (host:port on Render's private network)
        fromService:
          type: pserv
          name: access-media-asr
          property: hostport

  - type: pserv               # private: only the app can reach it; lesson audio never leaves Render
    name: access-media-asr
    runtime: image
    image:
      url: ghcr.io/speaches-ai/speaches:latest-cpu
    plan: standard            # 2 GB memory for the "small" Whisper model
    region: frankfurt
    disk:
      name: models            # the downloaded speech model, kept across restarts
      mountPath: /home/ubuntu/.cache/huggingface
      sizeGB: 2
    envVars:
      - key: HF_HUB_DISABLE_XET   # plain HTTPS model downloads (the newer downloader can hang)
        value: "1"

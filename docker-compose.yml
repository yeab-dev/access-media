# One command: docker compose up   →   http://localhost:8080
# Settings come from .env (copy .env.example). ADMIN_TOKEN is the staff access code.
services:
  web:
    build: .
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - lessons:/data
    restart: unless-stopped

  # Optional: a local open speech model for caption drafts (nothing leaves the machine).
  #   docker compose --profile asr up
  # then set ASR_URL=http://asr:8000 in .env. The first draft downloads the model (a few hundred MB).
  asr:
    profiles: ["asr"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    # Only this computer can reach it (for `npm start` with ASR_URL=http://localhost:8000).
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-small
      # Hugging Face's newer "xet" downloader hung on our network; plain HTTPS downloads work.
      - HF_HUB_DISABLE_XET=1
    volumes:
      - asr-models:/home/ubuntu/.cache/huggingface
    restart: unless-stopped

volumes:
  lessons:
  asr-models:

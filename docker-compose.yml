# One command: docker compose up   →   http://localhost:8080
# Settings come from .env (copy .env.example). ADMIN_TOKEN is the host's master key.
# Automatic captions are built in (whisper.cpp in the "web" image); the speech model downloads on first start.
services:
  web:
    build: .
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - lessons:/data
    restart: unless-stopped

  # On a public server: free HTTPS (Let's Encrypt) in front of the app.
  #   DOMAIN=<your-ip-with-dashes>.sslip.io docker compose --profile https up -d
  # (sslip.io turns 1-2-3-4.sslip.io into 1.2.3.4, so no domain needs buying.) Also set TRUST_PROXY=1 in .env.
  https:
    profiles: ["https"]
    image: caddy:2.8.4
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to web:8080
    volumes:
      - caddy-data:/data
    depends_on: [web]
    restart: unless-stopped

  # Optional, instead of the built-in speech model: a separate faster-whisper server.
  #   docker compose --profile asr up, then set ASR_URL=http://asr:8000 in .env.
  asr:
    profiles: ["asr"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    # Only this computer can reach it (for `npm start` with ASR_URL=http://localhost:8000).
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-small
      # Hugging Face's newer "xet" downloader hung on our network; plain HTTPS downloads work.
      - HF_HUB_DISABLE_XET=1
    volumes:
      - asr-models:/home/ubuntu/.cache/huggingface
    restart: unless-stopped

volumes:
  lessons:
  caddy-data:
  asr-models:
